# Helix with its production services: PostgreSQL, Redis job queue with a separate worker, and
# S3-compatible artifact storage (MinIO). The HELIX_* values are documented in .env.example; the
# Boltz worker values are defined in api/helix/boltz/settings.py and docs/providers/boltz2.md.
#
#   docker compose up --build
#
# Web: http://localhost:3000   API: http://localhost:8000/api/v1/docs   MinIO console: http://localhost:9001
# The credentials are development defaults. Replace them before exposing any port.

x-helix-environment: &helix-environment
  HELIX_ENVIRONMENT: production
  HELIX_LOG_FORMAT: json
  HELIX_DATABASE_URL: postgresql://helix:helix@postgres:5432/helix
  HELIX_REDIS_URL: redis://redis:6379/0
  HELIX_S3_BUCKET: helix-artifacts
  HELIX_S3_ENDPOINT_URL: http://minio:9000
  HELIX_S3_REGION: us-east-1
  HELIX_S3_ACCESS_KEY_ID: helix
  HELIX_S3_SECRET_ACCESS_KEY: helix-development-secret
  HELIX_CORS_ORIGINS: ${HELIX_CORS_ORIGINS:-http://localhost:3000}
  HELIX_CONTACT_EMAIL: ${HELIX_CONTACT_EMAIL:-}
  HELIX_NCBI_API_KEY: ${HELIX_NCBI_API_KEY:-}
  HELIX_ENABLE_NONCOMMERCIAL_SOURCES: ${HELIX_ENABLE_NONCOMMERCIAL_SOURCES:-false}
  HELIX_BOLTZ_WORKER_URL: ${HELIX_BOLTZ_WORKER_URL:-}
  HELIX_BOLTZ_WORKER_TOKEN: ${HELIX_BOLTZ_WORKER_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: helix
      MINIO_ROOT_PASSWORD: helix-development-secret
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The API does not create its bucket
  minio-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set helix http://minio:9000 helix helix-development-secret
        && mc mb --ignore-existing helix/helix-artifacts

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: *helix-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Jobs run here; the API only enqueues them. Scale with: docker compose up --scale worker=2
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "helix.worker"]
    environment: *helix-environment
    depends_on:
      # the API creates the tables first
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # the API as the browser reaches it, inlined at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_REPOSITORY_URL: ${NEXT_PUBLIC_REPOSITORY_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
