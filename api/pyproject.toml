[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "Helix API: open computational rare-disease research platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy>=2.1",
  "greenlet>=3.5",
  "aiosqlite>=0.22",
  "sse-starlette>=3.5",
  "rfc8785>=0.1.4",
  "numpy>=2.5",
  "gemmi>=0.7.5",
  "rdkit>=2026.3",
  "rapidfuzz>=3.14",
  "anthropic>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
redis = ["redis>=8.1"]
s3 = ["boto3>=1.40"]
dev = ["ruff>=0.16"]

[project.scripts]
helix-worker = "helix.worker:main"
helix-openapi = "helix.openapi:main"

[tool.setuptools.packages.find]
include = ["helix*"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# ASYNC109: adapters take a per-call timeout. ASYNC240: false positives on str.encode
ignore = ["B008", "ASYNC109", "ASYNC240"]
