[project]
name = "orphafold-lab-tools"
version = "0.1.0"
description = "Function tools and research-record tools of the OrphaFold agentic lab"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orphafold_lab_tools"]
