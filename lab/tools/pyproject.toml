[project]
name = "helix-lab-tools"
version = "0.1.0"
description = "Function tools and research-record tools of the Helix agentic lab"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["helix_lab_tools"]
